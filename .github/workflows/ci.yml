name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces that pull request's run. Runs on
# main are independent: each gets a group of its own, so none is cancelled
# and none waits behind another that is stuck in a queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  portable:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is Apple silicon, like macos-latest, but drawn from a
        # pool that has machines when the newest image's does not.
        os: [ubuntu-latest, macos-15]
    env:
      # The kernel programs are built in the `linux` job. Here the loader is
      # only type-checked against an empty stand-in.
      CEYNOX_WATCH_BPF_OBJECT: ${{ github.workspace }}/empty.o
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: touch empty.o
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: End-to-end tests (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked && dev/integration-macos.sh

  linux:
    name: build and end-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dev
          tags: ceynox-watch-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build
        run: dev/run.sh cargo build --release --locked
      - name: End-to-end tests
        run: dev/run.sh env CEYNOX_WATCH_BIN=/target/release/ceynox-watch dev/integration.sh

  deny:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
